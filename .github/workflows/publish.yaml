name: Publish to NuGet and npm

on:
  workflow_dispatch:
    inputs:
      target:
        description: Publish to
        type: choice
        options: [both, nuget, npm]
        default: both

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

# pgembed ships as a top-level package that points at one package per platform:
#   pgembed.<rid>   Native AOT, one per platform; AOT compiles only for the OS it runs on, so each is
#                   packed on a matching runner
#   pgembed.any     portable (JIT), for platforms without their own package
#   pgembed         the top-level package; dotnet tool install and dnx pick the right one from it
# Every platform package is pushed before the top-level one, so an install never finds one missing.
#
# npm gets the same Native AOT executables, taken from the NuGet packages (npm/build.mjs): one package per
# platform (@mysticmind/pgembed-<platform>) and pgembed, whose launcher runs the one npm installed. There is
# no portable package on npm: it would need .NET.
#
# "Publish to" picks both (NuGet, then npm), nuget or npm. Each push skips versions already published, so a
# version can go to one registry first and the other later.

jobs:
  # Native AOT packages, each built on its own OS (macOS packs osx-x64 too: AOT cross-compiles between the
  # architectures of one OS)
  pack-native:
    # publish only what is on main
    if: github.ref == 'refs/heads/main'
    name: Pack ${{ matrix.rid }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: win-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Native AOT links with clang on Linux
      - name: Install the AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack
        run: dotnet pack src/pgembed/pgembed.csproj -c Release -r ${{ matrix.rid }} -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.rid }}
          path: artifacts/*.nupkg

  # musl (Alpine) packages, packed in the Alpine SDK image. It runs through docker directly: GitHub's
  # JavaScript actions do not run inside Alpine containers on Arm runners.
  pack-musl:
    if: github.ref == 'refs/heads/main'
    name: Pack ${{ matrix.rid }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-musl-x64, os: ubuntu-latest }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pack in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:11.0-alpine sh -c \
            "apk add --no-cache clang build-base zlib-dev && dotnet pack src/pgembed/pgembed.csproj -c Release -r ${{ matrix.rid }} -o artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.rid }}
          path: artifacts/*.nupkg

  # the portable package, and the top-level package that points at all of them
  pack-portable:
    if: github.ref == 'refs/heads/main'
    name: Pack any and the top-level package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          dotnet pack src/pgembed/pgembed.csproj -c Release -r any -p:PublishAot=false -o artifacts
          # without AOT, a top-level pack also makes portable builds of every platform; only the top-level
          # package is kept from it: the platform packages come from their own jobs
          dotnet pack src/pgembed/pgembed.csproj -c Release -p:PublishAot=false -o top
          cp top/pgembed.[0-9]*.nupkg artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-portable
          path: artifacts/*.nupkg

  # NuGet, unless only npm was chosen; the packages are packed either way: npm's executables come from them
  push:
    needs: [pack-native, pack-musl, pack-portable]
    if: inputs.target != 'npm'
    runs-on: ubuntu-latest

    # NuGet trusted publishing: no stored API key. The job gets a GitHub OIDC token, which
    # nuget.org exchanges for an API key valid for one hour, provided it matches the trusted
    # publishing policy for this repository and workflow file (nuget.org > profile > Trusted Publishing).
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nupkg-*
          path: artifacts
          merge-multiple: true

      - name: List the packages
        run: ls -la artifacts

      # nuget.org reads the MCP server configuration from exactly .mcp/server.json; 0.2.0 shipped it as
      # .mcp//server.json, and nuget.org reported that the package had none
      - name: Check each package has .mcp/server.json
        run: |
          for package in artifacts/*.nupkg; do
            unzip -Z1 "$package" | grep -qx '.mcp/server.json' || { echo "::error::$package has no .mcp/server.json"; exit 1; }
          done

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # requested right before the push: the key expires after one hour
      - name: NuGet login (OIDC to short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: mysticmind # nuget.org profile name of the package owner, not an email address

      - name: Push the platform packages
        run: |
          for package in artifacts/pgembed.[a-z]*.nupkg; do
            dotnet nuget push "$package" -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
          done

      - name: Push the top-level package
        run: dotnet nuget push artifacts/pgembed.[0-9]*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

  # npm, unless only NuGet was chosen; with both, after NuGet, and not when the NuGet push failed
  npm:
    needs: [pack-native, pack-musl, pack-portable, push]
    if: >-
      !cancelled() && inputs.target != 'nuget'
      && needs.pack-native.result == 'success' && needs.pack-musl.result == 'success'
      && needs.pack-portable.result == 'success'
      && (needs.push.result == 'success' || needs.push.result == 'skipped')
    runs-on: ubuntu-latest

    # npm trusted publishing: like NuGet's, no stored token once the packages exist and each has this
    # repository and workflow file as its trusted publisher (npmjs.com > package > Settings). Until then (the
    # first publish), the NPM_TOKEN secret is used. Either way, npm records provenance: which workflow built it.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: nupkg-*
          path: artifacts
          merge-multiple: true

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # the executables of the platform packages, as they are in the NuGet packages
      - name: Build the npm packages
        run: |
          version=$(ls artifacts | sed -n 's/^pgembed\.\([0-9][0-9.]*[0-9]\(-[0-9A-Za-z.-]*\)\{0,1\}\)\.nupkg$/\1/p')
          test -n "$version" || { echo "::error::no top-level package in artifacts"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          for package in artifacts/pgembed.[a-z]*.nupkg; do
            rid=$(basename "$package" ".$version.nupkg"); rid=${rid#pgembed.}
            [ "$rid" = any ] && continue
            unzip -q "$package" "tools/any/$rid/*" -d unpacked
          done
          node npm/build.mjs unpacked/tools/any "$version" npm-out --all

      - name: Run the linux-x64 package through the launcher
        run: node npm/smoke.mjs npm-out "$VERSION"

      # platform packages first, as on NuGet; a rerun skips what is already published
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          for dir in npm-out/platforms/* npm-out/pgembed; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              continue
            fi
            npm publish "$dir" --access public --provenance
          done
